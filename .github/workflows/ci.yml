name: SITE CI
# Reproducible checks only: unit, PIM v3 contract/sync/DTO, checkout and payment states, static QA, SEO,
# release archive safety. Production dumps, supplier files and real-data rehearsals stay outside Git.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    runs-on: ubuntu-24.04
    # Stage 4 adds the CRM browser matrix (3 engines × 7 widths × 2 themes), 12 E2E scenarios and the 50 000-order check.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: site
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        volumes:
          - /tmp/mysqld:/run/mysqld
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
          # The rollback rehearsal reads this repository's pre-CRM revision.
          fetch-depth: 0
      - name: Pinned CRM frontend used by the real API browser tests
        uses: actions/checkout@v4
        with:
          repository: alexalixmanov-del/crm.rubizh
          ref: 7ba3a1791fad22855b3179d94a39c0adc0fbce0d
          path: crm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, gd, curl, openssl, fileinfo, intl, zip, sodium
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: CRM frozen dependencies, TypeScript build and formatting
        working-directory: crm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run format:check
      - name: Browsers for the checks (Chromium at /usr/bin/chromium; Firefox and WebKit for the CRM/SITE matrix)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo ln -sf "$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -1)" /usr/bin/chromium
      - name: Test PHP runtime layout (tests address /workspace/php-runtime/root/usr/bin/php8.4 with explicit -n/-d extension flags)
        run: |
          sudo mkdir -p /workspace/php-runtime/root/usr/bin /workspace/php-runtime/root/usr/lib/php/20240924
          sudo mkdir -p /workspace/reports
          sudo chown "$(id -u):$(id -g)" /workspace/reports
          sudo ln -s "$GITHUB_WORKSPACE/crm" /workspace/crm.rubizh
          sudo install -m755 tests/helpers/php-runtime-shim.sh /workspace/php-runtime/root/usr/bin/php8.4
          /workspace/php-runtime/root/usr/bin/php8.4 -n -d extension=/x/pdo.so -d extension=/x/mysqlnd.so -d extension=/x/pdo_mysql.so -r 'echo implode(",",PDO::getAvailableDrivers()),"\n";'
      - name: PHP syntax
        run: git ls-files '*.php' | xargs -n1 -P4 php -l > /dev/null
      - name: Apache 2.4 for the .htaccess routing test behind the hosting HTTPS proxy (stage561-proxy-https)
        run: |
          if [ ! -x /usr/sbin/apache2 ]; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apache2; fi
          sudo systemctl stop apache2 2>/dev/null || true
          /usr/sbin/apache2 -v
      - name: Tests (MariaDB over the service socket)
        env:
          RUBIZH_TEST_MYSQL_SOCKET: /tmp/mysqld/mysqld.sock
        run: |
          set -euo pipefail
          sudo chmod 777 /tmp/mysqld
          # runtime-http intentionally measures 8/32 concurrent clients. Keep other
          # DB/browser test files idle so shared-runner pressure cannot pollute it.
          node --test --test-reporter=tap --test-concurrency=1 tests/*.test.mjs | tee "$RUNNER_TEMP/site-tests.tap"
          grep -Eq '^# fail 0$' "$RUNNER_TEMP/site-tests.tap"
          grep -Eq '^# tests [1-9][0-9]*$' "$RUNNER_TEMP/site-tests.tap"
          grep -Eq '^# skipped 0$' "$RUNNER_TEMP/site-tests.tap"
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-crm-verification-${{ github.sha }}-php${{ matrix.php }}
          path: /workspace/reports
          if-no-files-found: warn
